<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="100%">
  <defs>
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&amp;family=Space+Mono&amp;display=swap');
      
      .title-text {
        font-family: 'Outfit', sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #0F172A;
        letter-spacing: 2px;
      }
      
      .subtitle-text {
        font-family: 'Outfit', sans-serif;
        font-weight: 600;
        font-size: 18px;
        fill: #0EA5E9;
        letter-spacing: 4px;
        text-transform: uppercase;
      }
      
      .desc-text {
        font-family: 'Outfit', sans-serif;
        font-weight: 400;
        font-size: 14px;
        fill: #475569;
        letter-spacing: 0.5px;
      }
      
      .code-text {
        font-family: 'Space Mono', monospace;
        font-size: 12px;
        fill: #94A3B8;
      }
      
      .accent-glow {
        filter: url(#blur-filter);
      }
      
      @keyframes float-slow {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(2deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      
      @keyframes float-fast {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(-3deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      
      .floating-1 { animation: float-slow 6s ease-in-out infinite; }
      .floating-2 { animation: float-fast 8s ease-in-out infinite; }
    </style>

    <!-- Gaussian Blur for Background Elements -->
    <filter id="blur-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" />
    </filter>

    <!-- Soft Drop Shadow for Text -->
    <filter id="text-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>

    <!-- Light Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Pastel Orbs Gradients -->
    <linearGradient id="pastel-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>

    <linearGradient id="pastel-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E8FF" />
      <stop offset="100%" stop-color="#E9D5FF" />
    </linearGradient>

    <linearGradient id="pastel-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CCFBF1" />
      <stop offset="100%" stop-color="#99F6E4" />
    </linearGradient>

    <!-- Light Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E2E8F0" stroke-width="1" stroke-opacity="0.7"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="850" height="320" fill="url(#bg-grad)" rx="16" />

  <!-- Background Grid -->
  <rect width="850" height="320" fill="url(#grid)" rx="16" />

  <!-- Soft Ambient Pastel Orbs -->
  <circle cx="120" cy="90" r="140" fill="url(#pastel-purple)" opacity="0.45" class="accent-glow" />
  <circle cx="760" cy="230" r="150" fill="url(#pastel-blue)" opacity="0.5" class="accent-glow" />
  <circle cx="450" cy="160" r="100" fill="url(#pastel-teal)" opacity="0.3" class="accent-glow" />

  <!-- Decorative Tech Elements / Floating Symbols -->
  <g opacity="0.6" class="floating-1">
    <!-- Code Brackets -->
    <text x="60" y="230" class="code-text" font-size="28px" fill="#0EA5E9">&lt;/&gt;</text>
    <text x="750" y="100" class="code-text" font-size="36px" fill="#6366F1">{ }</text>
  </g>
  
  <g opacity="0.5" class="floating-2">
    <!-- Floating Tech Words -->
    <text x="80" y="80" class="code-text" fill="#94A3B8">const developer = new Professional();</text>
    <text x="610" y="270" class="code-text" fill="#94A3B8">while (learning) { code(); }</text>
    <text x="390" y="60" class="code-text" fill="#94A3B8">import { React, Node } from 'stack';</text>
    <circle cx="690" cy="140" r="4" fill="#38BDF8" />
    <circle cx="180" cy="270" r="3" fill="#C084FC" />
    <circle cx="560" cy="70" r="5" fill="#818CF8" />
  </g>

  <!-- Central Visual Frame (Minimalist Border Layout) -->
  <rect x="25" y="25" width="800" height="270" rx="12" fill="none" stroke="#E2E8F0" stroke-width="1.5" />
  <path d="M 25 80 L 25 25 L 80 25" fill="none" stroke="#38BDF8" stroke-width="3" rx="12" />
  <path d="M 825 240 L 825 295 L 770 295" fill="none" stroke="#818CF8" stroke-width="3" rx="12" />

  <!-- Main Content -->
  <!-- Profile Name -->
  <text x="425" y="135" text-anchor="middle" class="title-text" filter="url(#text-shadow)">KHUSHAL SHIVADE</text>
  
  <!-- Role Title -->
  <text x="425" y="175" text-anchor="middle" class="subtitle-text">Software Developer</text>

  <!-- Divider Line -->
  <line x1="280" y1="202" x2="570" y2="202" stroke="#E2E8F0" stroke-width="2" />
  <circle cx="425" cy="202" r="4" fill="#38BDF8" />

  <!-- Brief Pitch / Tagline -->
  <text x="425" y="245" text-anchor="middle" class="desc-text" filter="url(#text-shadow)">Full Stack Engineer &amp; Tech Enthusiast</text>

</svg>
